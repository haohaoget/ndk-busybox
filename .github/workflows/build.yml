name: Build and Release Android ndk-busybox

on:
  push:
    tags:
      - 'v*' # Trigger on version tags (e.g., v1.0)
  workflow_dispatch: # Allow manual trigger

jobs:
  build:
    name: Build ndk-busybox
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b # Recommended NDK version, can be changed if needed
          add-to-path: true

      - name: Inject Dummy libselinux for Standalone Build
        run: |
          # Create a dummy selinux header to satisfy the compiler without needing the actual libselinux source
          mkdir -p include/selinux
          cat << 'EOF' > include/selinux/selinux.h
          #ifndef _SELINUX_H_
          #define _SELINUX_H_
          typedef char * security_context_t;
          static inline int is_selinux_enabled(void) { return 0; }
          static inline int getcon(security_context_t *con) { *con = 0; return -1; }
          static inline int getfscreatecon(security_context_t *con) { *con = 0; return -1; }
          static inline int setfscreatecon(security_context_t con) { return -1; }
          static inline int lgetfilecon(const char *path, security_context_t *con) { *con = 0; return -1; }
          static inline int getfilecon(const char *path, security_context_t *con) { *con = 0; return -1; }
          static inline int lsetfilecon(const char *path, security_context_t con) { return -1; }
          static inline int setfilecon(const char *path, security_context_t con) { return -1; }
          static inline int fsetfilecon(int fd, security_context_t con) { return -1; }
          static inline int fgetfilecon(int fd, security_context_t *con) { *con = 0; return -1; }
          static inline int security_check_context(security_context_t con) { return -1; }
          static inline int security_check_context_raw(security_context_t con) { return -1; }
          static inline int setexeccon(security_context_t con) { return -1; }
          static inline int getexeccon(security_context_t *con) { *con = 0; return -1; }
          static inline void freecon(security_context_t con) {}
          static inline int matchpathcon_init(const char *path) { return -1; }
          static inline int matchpathcon(const char *path, int mode, security_context_t *con) { *con = 0; return -1; }
          static inline int selinux_getenforce(void) { return 0; }
          static inline int selinux_boolean_sub(const char *name, char **sub) { *sub = 0; return -1; }
          static inline int security_has_boolean(const char *name) { return -1; }
          static inline int security_set_boolean(const char *name, int value) { return -1; }
          static inline int security_commit_booleans(void) { return -1; }
          static inline int security_get_boolean_active(const char *name) { return -1; }
          static inline const char *selinux_policy_root(void) { return 0; }
          static inline int selinux_getenforcemode(int *mode) { *mode = 0; return -1; }
          static inline int selinux_mkload_policy(int preservebools) { return -1; }
          static inline int selinux_file_context_verify(const char *path, int mode) { return -1; }
          static inline int security_getenforce(void) { return -1; }
          static inline int security_policyvers(void) { return -1; }
          static inline int security_get_boolean_names(char ***names, int *len) { *names = 0; *len = 0; return -1; }
          static inline int security_get_boolean_pending(const char *name) { return -1; }
          static inline int security_setenforce(int value) { return -1; }
          static inline int security_canonicalize_context_raw(security_context_t con, security_context_t *out) { *out = 0; return -1; }
          // Dummy basic types
          typedef unsigned int security_class_t;
          static inline int security_compute_create(security_context_t scon, security_context_t tcon, security_class_t tclass, security_context_t *newcon) { *newcon = 0; return -1; }
          typedef struct context_s_t * context_t;
          static inline context_t context_new(const char *str) { return (context_t)0; }
          static inline const char * context_type_get(context_t c) { return 0; }
          static inline int context_type_set(context_t c, const char *s) { return -1; }
          static inline const char * context_range_get(context_t c) { return 0; }
          static inline int context_range_set(context_t c, const char *s) { return -1; }
          static inline const char * context_role_get(context_t c) { return 0; }
          static inline int context_role_set(context_t c, const char *s) { return -1; }
          static inline const char * context_user_get(context_t c) { return 0; }
          static inline int context_user_set(context_t c, const char *s) { return -1; }
          static inline char * context_str(context_t c) { return 0; }
          static inline void context_free(context_t c) {}
          #endif
          EOF
          touch include/selinux/context.h

          # Inject missing SysV IPC prototypes into libbb.h to prevent int-conversion errors
          cat << 'EOF' >> include/libbb.h
          void *shmat(int shmid, const void *shmaddr, int shmflg);
          int shmget(int key, size_t size, int shmflg);
          int shmdt(const void *shmaddr);
          int shmctl(int shmid, int cmd, void *buf);
          EOF

          # Only remove the static library dependency to avoid linker failure, keep building the actual .c files using our dummy inline functions
          sed -i '/LOCAL_STATIC_LIBRARIES := libselinux/d' Android.mk

      - name: Build with ndk-build
        run: |
          # Build for multiple Android architectures
          ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk APP_ABI="arm64-v8a armeabi-v7a x86 x86_64" APP_PLATFORM=android-21 APP_ALLOW_MISSING_DEPS=true

      - name: Prepare Release Assets
        run: |
          mkdir -p release_assets
          # Rename and copy the binaries to a single folder for releasing
          if [ -d "libs/arm64-v8a" ]; then cp libs/arm64-v8a/busybox release_assets/busybox-arm64-v8a; fi
          if [ -d "libs/armeabi-v7a" ]; then cp libs/armeabi-v7a/busybox release_assets/busybox-armeabi-v7a; fi
          if [ -d "libs/x86" ]; then cp libs/x86/busybox release_assets/busybox-x86; fi
          if [ -d "libs/x86_64" ]; then cp libs/x86_64/busybox release_assets/busybox-x86_64; fi

      - name: Upload to Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: busybox-binaries
          path: release_assets/

      - name: Create Release and Upload
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          generate_release_notes: true
